# Free keyword rules that decide which stories are worth a closer look.
# Words match whole words in the headline, upper or lower case.
# If alerts are too noisy, add words to skip_words.

# Only stories published in the last few days are considered.
max_age_hours: 72

# Articles within this many days can count as the same story, so a launch
# is not alerted again when later coverage appears.
same_story_window_days: 180
title_similarity: 0.6

# The Claude model used for the second look. Haiku uses the least plan usage.
claude_model: haiku

# Kint's rule: a rumor is alerted only once this many different sites report it.
rumor_min_sources: 2

brands:
  Canon: [canon]
  Nikon: [nikon]
  Sony: [sony]
  Fujifilm: [fujifilm, fuji]
  Panasonic: [panasonic, lumix]
  OM System: [om system, olympus]
  Leica: [leica]
  Hasselblad: [hasselblad]
  DJI: [dji]
  Sigma: [sigma]
  Tamron: [tamron]
  Tokina: [tokina]
  Viltrox: [viltrox]
  Samyang: [samyang]
  Ricoh: [ricoh, pentax]
  Adobe: [adobe, photoshop, lightroom, camera raw]
  # Camera and lens makers.
  Zeiss: [zeiss]
  Voigtlander: [voigtlander, voigtländer]
  Laowa: [laowa, venus optics]
  TTArtisan: [ttartisan, tt artisan]
  7Artisans: [7artisans, 7 artisans]
  Meike: [meike]
  Sirui: [sirui]
  Phase One: [phase one]
  Kodak: [kodak]  # needs a camera, film or photo word (see name_guards)
  Ilford: [ilford]
  Blackmagic Design: [blackmagic]
  RED: [red digital cinema, red komodo, red v-raptor, red raptor, red monstro, red helium, red gemini, red dragon]
  Insta360: [insta360]
  GoPro: [gopro]
  # Lighting makers.
  Godox: [godox]
  Profoto: [profoto]
  Nanlite: [nanlite]
  Aputure: [aputure]
  # Storage makers.
  SanDisk: [sandisk]
  Lexar: [lexar]
  ProGrade: [prograde]
  # Editing software makers (the brand of a software story, for its official pages).
  Skylum: [skylum, luminar]
  # More lens makers.
  Thypoch: [thypoch]
  # Phone makers, only when the headline is about the camera or photos (see name_guards). "iPhone" alone is not
  # Apple: "RAW photo editor for iPhone" is another maker's app.
  Apple: [apple]
  Google: [google pixel, pixel camera, google photos]

# A name that is also an ordinary word only counts when one of these words is in the same text
# (or a model number follows it, as in "Sigma 85mm"). Keys are brand or software names, lower case.
name_guards:
  sigma: [lens, lenses, camera, cameras, mirrorless, dslr, art, contemporary, sport, fp, dg, dn, teleconverter, firmware]
  kodak: [camera, cameras, film, films, photo, photos, photography]
  luminar: [neo, photo, photos, editor, editing, skylum, update, release, ai]
  gimp: [photo, photos, editor, editing, software, image, version, update, release]
  on1: [photo, photos, raw, editor, software, update, release]
  apple: [camera, cameras, photo, photos, photography, proraw, lens, lenses, sensor]
  google pixel: [camera, cameras, photo, photos, photography, lens, lenses, sensor]

# Checked in order. The first match sets the category.
categories:
  - {id: photoshop, words: [photoshop]}
  - {id: lightroom, words: [lightroom]}
  - {id: camera-raw, words: [camera raw]}
  - {id: firmware, words: [firmware]}
  - {id: lens, words: [lens, lenses, prime, zoom, teleconverter]}
  - {id: lighting, words: [godox, profoto, nanlite, aputure, strobe, strobes, softbox]}
  - {id: storage, words: [sandisk, lexar, prograde, cfexpress]}
  - {id: capture-one, words: [capture one]}
  - {id: luminar, words: [luminar]}
  - {id: dxo, words: [dxo, photolab, pureraw, nik collection]}
  - {id: affinity, words: [affinity photo, affinity by canva]}
  - {id: topaz, words: [topaz]}
  - {id: other-software, words: [on1, photomator, pixelmator, darktable, gimp, adobe bridge, adobe firefly]}
  - {id: gear, words: [drone, gimbal, flash, tripod, memory card]}
  - {id: camera, words: [camera, cameras, mirrorless, dslr, compact, rangefinder]}

# Editing software that is not a camera brand. Each name is matched in full (for example "Affinity Photo", not "Affinity").
software_words:
  - capture one
  - luminar
  - dxo
  - photolab
  - pureraw
  - nik collection
  - affinity photo
  - affinity by canva
  - on1
  - topaz labs
  - topaz photo ai
  - topaz gigapixel
  - photomator
  - pixelmator
  - darktable
  - gimp

launch_words:
  - announce
  - announces
  - announced
  - announcing
  - launch
  - launches
  - launched
  - unveil
  - unveils
  - unveiled
  - introduce
  - introduces
  - introduced
  - introducing
  - release
  - releases
  - released
  - debut
  - debuts
  - reveals
  - revealed
  - arrives
  - now available
  - available
  - firmware
  - new version
  - update
  - updates
  - updated

# Speculation or unconfirmed words. One of these in the headline or the excerpt
# makes the item a RUMOR. When unsure, the label is RUMOR.
rumor_words:
  - rumor
  - rumors
  - rumored
  - rumour
  - rumours
  - rumoured
  - leak
  - leaks
  - leaked
  - reportedly
  - allegedly
  - unconfirmed
  - speculation
  - speculated
  - suspect
  - suspects
  - suspected
  - sources say
  - tipped
  - patent
  - patents
  - spotted
  - registered
  - said to
  - delayed
  - delay
  - delays
  - postponed
  - scrapped
  - cancelled
  - canceled
  - slipped
  - pushed back
  - off the table

# Hedge words. In the headline they always make the item a RUMOR. In the excerpt they
# do not, when the headline is a clear release (see classify.rumor_signal).
hedge_words:
  - might
  - could
  - possibly
  - "may be"

# Count as a RUMOR only when the headline has no launch or update word.
# "A new tool is coming to Lightroom ... the 4 biggest updates" stays OFFICIAL.
soft_rumor_words:
  - is coming
  - are coming
  - coming next
  - coming soon
  - coming to
  - expected to

# Adobe items are alerted only when the headline is about one of these.
adobe_scope_words:
  - photoshop
  - lightroom
  - camera raw
  - adobe bridge

# Adobe Firefly counts only with one of these photo-editing words (a generative image model alone does not).
firefly_photo_words:
  - photo
  - photos
  - photography
  - photo editing
  - editing
  - edit

# A rumor-site headline is official when it has one of these release words and none of the block words.
rumor_site_release_words:
  - firmware update
  - firmware updates
  - available
  - announced
  - released
  - launches

rumor_site_block_words:
  - rumor
  - rumors
  - rumored
  - rumour
  - rumours
  - rumoured
  - leak
  - leaks
  - leaked
  - could
  - may
  - expected
  - reportedly

skip_words:
  - deal
  - deals
  - discount
  - sale
  - save
  - "off"  # quoted, or YAML reads it as false
  # Hands-on and personal-trial pieces are opinion, not news (added after a round 3 dry run).
  - hands-on
  - hands on
  - i took
  - i tried
  - i tested
  - i used
  - we took
  - we tried
  - field test
  - my experience
  - black friday
  - cyber monday
  - prime day
  - gift guide
  - gifts
  - bargain
  - cheapest
  - best
  - review
  - reviewed
  - tested
  - tutorial
  - how to
  - tips
  - podcast
  - giveaway
  - contest
  - competition
  - awards
  - winners
  - sponsored
  - opinion
  - versus
  - vs
  - recap
  - roundup
  - round up
  # Opinion pieces that ask whether something is worth buying (added in the functional round).
  - is it worth it
  - worth it
  # Trivia, how-tos and accessories (added after a dry run).
  - hack
  - hacks
  - diy
  - accessory
  - accessories
  - strap
  - straps
  - backpack
  - camera bag
  - made in
  - manufactured
  - behind the scenes
  - wallpaper
  - so cool
  - as a monitor
  # Live blogs and watch-live coverage pages, not announcements (added after a dry run).
  - follow live
  - follow along
  - live blog
  - live updates
  - live coverage
  - how to watch
  - watch live
  - where to watch
  - ways to watch

# ---------- Kint's big brand and photographer gates (November 2026) ----------
# Only stories about these big, well known photography brands become new stories, Slack alerts and rows on the
# dashboard and David's page. Names are the brand names used in "brands" above (or an editing software name from
# software_words, such as Capture One). Remove this list to turn the brand gate off.
big_brands:
  - Canon
  - Nikon
  - Sony
  - Fujifilm
  - Panasonic
  - OM System
  - Leica
  - Hasselblad
  - Sigma
  - Tamron
  - DJI
  - GoPro
  - Insta360
  - Adobe
  - Capture One
  - Skylum
  - Apple
  - Google
  - Blackmagic Design

# Only news that is good for a marketing post and truly for photographers. Words match whole words, any case.
photo_relevance:
  # A product from one of these makers is not a big brand product, even when the headline names a big brand's mount
  # ("Mitakon 45mm f/1.4 for Fujifilm GFX"). Makers in "brands" that are not in big_brands count too.
  third_party_makers: [mitakon, zhongyi, zhong yi, zy optics, vistilen, owlkrown, calumet, mandler, cosina,
                       viltrox, yongnuo, brightin star, astrhori, kipon, smallrig, tilta, ulanzi, neewer, pergear,
                       artra lab, light lens lab, funleader, dulens, nisi, kase, haida]
  # Not a photography product, in the headline or the excerpt.
  off_topic_words: [robot vacuum, robot vacuums, robotic vacuum, vacuum cleaner, robovac, robot mower, lawn mower,
                    power station, e-bike, ebike, projector, binoculars, toy drone, toy drones]
  # Corporate, financial, political or unofficial (fan made firmware) news, in the headline.
  off_topic_headline_words: [revenue, revenues, earnings, profit, profits, money, billion, financial results,
                             quarterly, fiscal, shares, stock price, investors, merger, acquisition, acquires,
                             lawsuit, sues, layoffs, ceo, president, tariff, tariffs, data leak, breach, auction,
                             bestseller, market share, vibe coded, vibe coding, custom firmware, hacked]
  # Minor bug fix updates, in the headline.
  minor_update_words: [bug, bugs, bug fix, bug fixes, fixes, stability improvements, minor update]
  # Brands that also make things that are not for photographers (vacuums, phones, toys): their stories need a photo
  # word in the headline or the excerpt.
  needs_photo_word: [DJI, Apple, Google, GoPro, Insta360]
  photo_words: [camera, cameras, photo, photos, photography, photographer, photographers, lens, lenses, sensor,
                megapixel, megapixels, raw, proraw, drone, drones, gimbal, mavic, osmo, image, images, editing]

# Stories Kint hid by hand (story id). They stay in the data and leave the page and David's copy.
# 67: Nikon "vibe coding" opinion piece, not news for photographers.
hidden_story_ids: [67]

# Kint's one-off exceptions to the rumor rule, by story id. Only these stories may make a carousel without having been
# sent to Slack as official, and only from the official pages listed (every fact, price and image). The dashboard
# shows these pages as the story's sources instead of the rumor article. Every other story keeps the rumor rule.
# 21: Nikon NIKKOR Z 120-300mm f/2.8 TC VR S, first seen on a rumor site, later announced by Nikon (approved 2026-11-27).
official_override_stories:
  21:
    approved_by: Kint
    approved_on: "2026-11-27"
    title: "Nikon releases the NIKKOR Z 120-300mm f/2.8 TC VR S"
    official_urls:
      - https://www.nikon.com/company/news/2026/1029_01/
      - https://www.nikonusa.com/press-room/NIKKOR-Z-120-300mm
