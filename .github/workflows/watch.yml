# TPM Photo News Watcher, in the cloud (24/7, also while Kint's laptop is off).
#
# Every hour, and when started by hand (Actions tab, "Run workflow"):
#   1. reads the shared memory from state/ (src/cloud_state.py)
#   2. checks the news with the free rules only (no Claude in the cloud) and sends the Slack alerts
#   3. marks official stories that need a carousel as "needs Kint" (carousels are built on the laptop, where the
#      fact check and the official image check run; the cloud never uses any other image)
#   4. saves its own state files back to state/ and commits them as github-actions[bot], only when they changed
#   5. builds the read only copy for David and publishes output/share/latest to GitHub Pages
#
# Nothing is ever posted to social media. The Slack address comes only from the repository secret
# SLACK_WEBHOOK_URL and is never printed. Pause it: Actions tab, this workflow, "..." menu, "Disable workflow".
name: TPM photo news watcher

on:
  schedule:
    # GitHub often skips scheduled runs, so the hourly check is asked for twice an hour (the laptop also nudges it,
    # see src/cloud_nudge.py). Runs never overlap and an alert is never sent twice.
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:

# Two runs never overlap: a new run waits until the one before it has finished.
concurrency:
  group: tpm-photo-news-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the code and the shared state
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 (the same as the laptop's .venv)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the requirements and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Read the shared state
        run: python src/cloud_state.py pull --side cloud

      - name: Check the news and send the Slack alerts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python src/run.py --cloud --no-claude

      - name: Save the cloud's state files
        run: python src/cloud_state.py push --side cloud

      - name: Check that nothing secret or personal would be committed
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/check_public_safe.py

      - name: Commit the state, only when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.sqlite state/activity-cloud.csv
          if git diff --cached --quiet; then
            echo "State unchanged, nothing to commit."
          else
            git commit -m "Update watcher state [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase && git push; then pushed=1; break; fi
              sleep 10
            done
            [ "$pushed" = 1 ] || { echo "The state could not be pushed."; exit 1; }
          fi

      - name: Build the read only copy for David
        run: python scripts/export_share_pack.py --cloud

      - name: Package the website for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/share/latest

  deploy:
    needs: watch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
